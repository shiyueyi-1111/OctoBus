syntax = "proto3";
package dingtalk.todo.v1;

service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc MarkDone(MarkDoneRequest) returns (MarkDoneResponse);
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (TodoMutationResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (TodoMutationResponse);
}

message CreateTodoRequest {
  string title = 1;
  string description = 2;
  string due_date = 3;      // ISO 时间（可选）
  string assignee_id = 4;   // 钉钉 userId（默认自己）
  string profile = 5;       // Stable corpId:userId selector
}

message CreateTodoResponse {
  bool success = 1;
  string todo_id = 2;
  string error = 3;
}

message ListTodosRequest {
  bool is_done = 1;         // 筛选完成状态（可选）
  int32 limit = 2;
  string start_at = 3;      // ISO-8601 inclusive boundary
  string end_at = 4;        // ISO-8601 exclusive boundary
  int32 fetch_limit = 5;
  string profile = 6;       // Stable corpId:userId selector (optional for compatibility)
}

message TodoItem {
  string todo_id = 1;
  string title = 2;
  string description = 3;
  bool is_done = 4;
  string due_date = 5;
  string created_at = 6;
  int32 priority = 7;
}

message ListTodosResponse {
  bool success = 1;
  repeated TodoItem todos = 2;
  string error = 3;
  bool complete = 4;
  int32 fetched_count = 5;
  int32 excluded_without_due_at = 6;
  string range_start = 7;
  string range_end = 8;
}

message MarkDoneRequest {
  string keyword = 1;       // 按关键词匹配待办标题
}

message MarkDoneResponse {
  bool success = 1;
  int32 matched_count = 2;
  string error = 3;
}

message GetTodoRequest {
  string todo_id = 1;
  string profile = 2;
}

message GetTodoResponse {
  bool success = 1;
  TodoItem todo = 2;
  string error = 3;
  string error_code = 4;
}

message UpdateTodoRequest {
  string todo_id = 1;
  string profile = 2;
  optional string title = 3;
  optional string due_date = 4;
  optional int32 priority = 5;
}

message DeleteTodoRequest {
  string todo_id = 1;
  string profile = 2;
  bool confirmed = 3;
}

message TodoMutationResponse {
  bool success = 1;
  string todo_id = 2;
  string error = 3;
  string error_code = 4;
  bool outcome_uncertain = 5;
}
