syntax = "proto3";
package dingtalk.calendar.v1;

service CalendarService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc AddEventAttendees(AddEventAttendeesRequest) returns (AttendeeMutationResponse);
  rpc RemoveEventAttendees(RemoveEventAttendeesRequest) returns (AttendeeMutationResponse);
  rpc SearchRooms(SearchRoomsRequest) returns (SearchRoomsResponse);
  rpc QueryRoomBusy(QueryRoomBusyRequest) returns (QueryRoomBusyResponse);
  rpc AddEventRooms(EventRoomsRequest) returns (RoomMutationResponse);
  rpc RemoveEventRooms(EventRoomsRequest) returns (RoomMutationResponse);
}

message ListEventsRequest {
  string start = 1;
  string end = 2;
  string profile = 3;
}

message CalendarEvent {
  string id = 1;
  string summary = 2;
  string start = 3;
  string end = 4;
  bool is_all_day = 5;
  string description = 6;
  string location = 7;
  repeated string attendees = 8;
  string status = 9;
}

message ListEventsResponse {
  bool success = 1;
  repeated CalendarEvent events = 2;
  string error = 3;
}

message CreateEventRequest {
  string title = 1;
  string start = 2;
  string end = 3;
  string location = 4;
  repeated string attendees = 5;
  string description = 6;
  string timezone = 7;
  repeated string open_dingtalk_ids = 8;
}

message CreateEventResponse {
  bool success = 1;
  string event_id = 2;
  string error = 3;
}

message GetEventRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
}

message GetEventResponse {
  bool success = 1;
  CalendarEvent event = 2;
  string error = 3;
  string error_code = 4;
}

message UpdateEventRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
  optional string title = 4;
  optional string start = 5;
  optional string end = 6;
  optional string description = 7;
  optional string timezone = 8;
}

message UpdateEventResponse {
  bool success = 1;
  string event_id = 2;
  string error = 3;
  string error_code = 4;
  bool outcome_uncertain = 5;
}

message DeleteEventRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
}

message DeleteEventResponse {
  bool success = 1;
  string event_id = 2;
  string error = 3;
  string error_code = 4;
  bool outcome_uncertain = 5;
}

message AddEventAttendeesRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
  repeated string attendees_to_add = 4;
}

message RemoveEventAttendeesRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
  repeated string attendees_to_remove = 4;
}

message AttendeeMutationResponse {
  bool success = 1;
  string event_id = 2;
  string error = 3;
  string error_code = 4;
  bool outcome_uncertain = 5;
}

message SearchRoomsRequest {
  string start = 1;
  string end = 2;
  string profile = 3;
  string room_name = 4;
  string group_id = 5;
}

message MeetingRoom {
  string room_id = 1;
  string name = 2;
  string group_id = 3;
  bool custom_approval_process = 4;
  bool support_recurring = 5;
}

message SearchRoomsResponse {
  bool success = 1;
  repeated MeetingRoom rooms = 2;
  string error = 3;
  string error_code = 4;
}

message QueryRoomBusyRequest {
  string start = 1;
  string end = 2;
  string profile = 3;
  repeated string room_ids = 4;
}

message QueryRoomBusyResponse {
  bool success = 1;
  string raw_json = 2;
  string error = 3;
  string error_code = 4;
}

message EventRoomsRequest {
  string event_id = 1;
  string calendar_id = 2;
  string profile = 3;
  repeated string room_ids = 4;
}

message RoomMutationResponse {
  bool success = 1;
  string event_id = 2;
  string error = 3;
  string error_code = 4;
  bool outcome_uncertain = 5;
}
